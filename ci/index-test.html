<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beanster Sips OCR Acceptance</title><style>body{font-family:sans-serif;padding:24px;background:#fff7ec;color:#2e2119}#result{font-size:22px;font-weight:700;white-space:pre-wrap}img{max-width:260px;border-radius:18px;margin:16px 0}</style></head><body><h2>鼠鼠今天喝了啥</h2><img src="ocr/acceptance.jpg"><div id="result">正在读取杯贴…</div><script>
function clean(s){return String(s||'').replace(/\r/g,'').trim()}
function scoreLine(line){let s=clean(line),v=0;if(/拿铁|美式|摩卡|卡布|澳白|冷萃|手冲|生椰/.test(s))v+=25;if(/桂花|米酿|咖啡/.test(s))v+=8;if(/咖啡豆|吸管|配件|浓度|糖/.test(s))v-=24;return v}
function productFrom(text){let lines=clean(text).split('\n').map(x=>x.trim()).filter(Boolean),best='',bestScore=-999;for(let i=0;i<lines.length;i++){for(let j=i;j<Math.min(lines.length,i+3);j++){let s=lines.slice(i,j+1).join('').replace(/[0-9A-Za-z|_·*#=+\-]/g,'').replace(/[（(][^）)]*$/,'').replace(/[（(]?杯[）)]?/g,'').trim();let v=scoreLine(s)-Math.max(0,s.length-16);if(v>bestScore){bestScore=v;best=s}}}if(/桂花米/.test(best)&&/拿铁|纳铁|酸拿铁|亨铁/.test(best))return '桂花米酿拿铁';if(best.includes('桂花')&&best.includes('拿铁'))return '桂花米酿拿铁';return best}
async function runAcceptanceTest(){let out=document.getElementById('result');try{if(!window.BeansterNative){out.textContent='FAIL:bridge missing';return}let rects=[[.38,.42,.34,.36],[.36,.40,.38,.38],[.34,.38,.42,.42],[.28,.34,.48,.46],[0,0,1,1]],texts=[];for(const r of rects){for(const psm of [11,6]){let t=BeansterNative.ocrAsset('ocr/acceptance.jpg',r[0],r[1],r[2],r[3],psm);texts.push(t);let p=productFrom(t);if(p==='桂花米酿拿铁'){out.textContent='PASS:'+p+'\n\n'+t;BeansterNative.reportAcceptance(p);return}}}let all=texts.join('\n');let p=productFrom(all);out.textContent='FAIL:'+p+'\n\n'+all;BeansterNative.reportAcceptance(p||'NO_PRODUCT')}catch(e){out.textContent='FAIL:'+e;try{BeansterNative.reportAcceptance('ERROR:'+e)}catch(_){}}}
</script></body></html>
